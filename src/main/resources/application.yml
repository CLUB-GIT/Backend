spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/club_git_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  #   url: jdbc:h2:mem:testdb
  #   username: sa
  #   password: 
  #   driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    # show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000     # 24 heures
    refresh-expiration-ms: 604800000  # 7 jours

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    '[com.club.git.backend_app]': DEBUG
    '[org.springframework.security]': INFO
